<!DOCTYPE html>
<html lang="en" layout:decorate="~{app/layout}"
      th:with="title=#{login}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org/">
<head>
    <title th:text="${title}"></title>
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
    <link media="screen" rel="stylesheet" th:href="@{/css/login.css}"/>
</head>
<body>

<th:block layout:fragment="content">
    <form class="form-login" method="post" th:action="@{/login}">
        <h1 class="h3 mb-3 font-weight-normal" th:text="#{login-header}">Please sign in</h1>
        <div th:if="${param.failed}" class="alert alert-danger" th:text="#{login-error}">
            Invalid username or password!
        </div>
        <label class="sr-only" for="inputEmail" th:text="#{username}">Email address</label>
        <input autofocus="autofocus"
               autocomplete="username"
               class="form-control"
               id="inputEmail"
               name="username"
               th:placeholder="#{username}"
               required="required"
               type="text"/>
        <label class="sr-only" for="inputPassword" th:text="#{password}">Password</label>
        <input autocomplete="current-password"
               class="form-control"
               id="inputPassword"
               name="password"
               th:placeholder="#{password}"
               required="required"
               type="password"/>
        <div class="checkbox mb-3">
            <label>
                <input name="remember-me" type="checkbox" value="remember-me"/>
                <th:block th:text="#{remember-me}">Remember me</th:block>
            </label>
        </div>
        <button class="btn btn-lg btn-primary btn-block" type="submit" th:text="#{sign-in}">Sign in</button>
        <p class="mt-5 mb-3 text-muted">&copy;
            <th:block th:text="#{copyright}">2017-2019</th:block>
        </p>
    </form>
</th:block>
</body>
</html>
